<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <h1>Contact Manager</h1>

        <!-- Message Area -->
        <div id="message-area"></div>
        
        <!-- Loading Indicator -->
        <div id="loading-indicator" class="hidden">Loading data...</div>

        <!-- Form Section -->
        <section id="contact-form-section">
            <h2>Add New Contact</h2>
            <form id="contact-form">
                <input type="text" id="name" placeholder="Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="tel" id="phone" placeholder="Phone">
                <button type="submit" id="form-submit-btn">Add Contact</button>
                <button type="button" id="cancel-edit-btn" class="hidden">Cancel Edit</button>
            </form>
        </section>

        <!-- List Section -->
        <section id="contact-list-section">
            <h2>Current Contacts</h2>
            <table id="contacts-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Contacts will be injected here by script.js -->
                </tbody>
            </table>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
